<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Test PWA</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="icons/32.png">
    <link rel="icon" href="icons/128.png">
    <link rel="icon" href="icons/256.png">
    <link rel="icon" href="icons/512.png">
    <meta name="web-app-status-bar" content="#f7df1e">
    <meta name="theme-color" content="#f7df1e">
</head>
<body>
    <div class="secondairyui" id="header">
        <div class="centeredtext themeborder styledheader">doel:</div>
        <select class="centeredtext themeborder styledheader" id="floor" onchange="changeFloorIntent()" style="border-left: 0;border-right: 0;">
            <option value="" hidden selected>kies verdieping</option>
            <option value="0">begane grond</option>
            <option value="1">verdieping 1</option>
            <option value="2">verdieping 2</option>
            <option value="3">verdieping 3</option>
            <option value="4">verdieping 4</option>
        </select>
        <select class="centeredtext themeborder styledheader" id="classroom" onchange="drawroute()" disabled>
            <option value="unusable" hidden selected>klaslokaal</option>
        </select>
    </div>
    <div id="container">
        <div id="overlay" onclick="getClickPosition(event)">
            <svg id="svg" style="width: 100%; height: 100%;">

            </svg>
        </div><!--the overlay for svg elements, is rotated 160deg-->
        <div id="imagecontainer">
            <img class="map" id="floor0" src="images/0.png" hidden>
            <img class="map" id="floor1" src="images/1.png" hidden>
            <img class="map" id="floor2" src="images/2.png" hidden>
            <img class="map" id="floor3" src="images/3.png" hidden>
            <img class="map" id="floor4" src="images/4.png" hidden>
        </div><!-- for the images to load -->
    </div>
    <div class="secondairyui" id="footer">
        <div class="centeredtext themeborder" id="textfooter">
            huidige verdieping:
        </div>
        <div class="centeredtext" id="currentfloor" style="font-size: 5vw;"></div>
        <div id="buttons">
            <button class="themeborder" id="arrowup" style="border-bottom: 0;" onclick="changefloor(1)">
                <svg height="30px" width="30px" version="1.1" id="Capa_1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 131.27 131.27" xml:space="preserve">
                <g><g><path style="fill:#010002;" d="M128.286,110.837c-0.901,0-1.79-0.406-2.375-1.181L65.634,30.296L5.357,109.655 c-0.996,1.319-2.864,1.569-4.177,0.573s-1.569-2.864-0.573-4.177l65.027-85.619l65.027,85.619c0.996,1.313,0.746,3.18-0.573,4.177 C129.551,110.64,128.919,110.837,128.286,110.837z"/></g></g>
                </svg>
            </button>
            <button class="themeborder" id="arrowdown" onclick="changefloor(-1)" disabled>
                <svg height="30px" width="30px" version="1.1" id="Capa_1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 131.27 131.27" xml:space="preserve">
                    <g><g><path style="fill:#010002;" d="M65.636,110.839L0.609,25.22c-0.996-1.313-0.746-3.18,0.573-4.177 c1.313-1.002,3.18-0.746,4.177,0.573l60.277,79.359l60.277-79.359c0.996-1.319,2.864-1.575,4.177-0.573 c1.313,0.996,1.569,2.864,0.573,4.177L65.636,110.839z"/> </g></g>
                </svg>
            </button>
        </div>
    </div>
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
