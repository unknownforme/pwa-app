<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Test PWA</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="icons/icon_32x32.png">
    <link rel="icon" href="icons/icon_128x128.png">
    <link rel="icon" href="icons/icon_256x256.png">
    <link rel="icon" href="icons/icon_512x512.png">
    <meta name="web-app-status-bar" content="#f7df1e">
    <meta name="theme-color" content="#f7df1e">
</head>
<body>
    <div id="header">
        <div class="centeredtext themeborder styledheader">doel:</div>
        <select class="centeredtext themeborder styledheader" id="floor" onchange="changeFloorIntent()" style="border-left: 0;border-right: 0;">
            <option value="" hidden selected>kies verdieping</option>
            <option value="0">begane grond</option>
            <option value="1">verdieping 1</option>
            <option value="2">verdieping 2</option>
            <option value="3">verdieping 3</option>
            <option value="4">verdieping 4</option>
        </select>
        <select class="centeredtext themeborder styledheader" id="classroom" disabled>
            <option hidden selected>klaslokaal</option>
        </select>
    </div>
    <div id="container">
        <div id="overlay" onclick="getClickPosition(event)">
            <svg id="svg" style="width: 100%; height: 100%;">

            </svg>
        </div><!--the overlay for svg elements, is rotated 160deg-->
        <div id="imagecontainer">
            <img class="map" id="floor0" src="images/0.png" hidden>
            <img class="map" id="floor1" src="images/1.png" hidden>
            <img class="map" id="floor2" src="images/2.png" hidden>
            <img class="map" id="floor3" src="images/3.png" hidden>
            <img class="map" id="floor4" src="images/4.png" hidden>
        </div><!-- for the images to load -->
    </div>
    <div id="demo"></div>
    <div id="footer">
        <div class="centeredtext themeborder" id="textfooter">
            huidige verdieping:
        </div>
        <div class="centeredtext" id="currentfloor" style="font-size: 5vw;"></div>
        <div id="buttons">
            <button class="themeborder" id="arrowup" style="border-bottom: 0;" onclick="changefloor(1)">1 verdieping omhoog</button>
            <button class="themeborder" id="arrowdown" onclick="changefloor(-1)" disabled>1 verdieping omlaag</button>
        </div>
    </div>
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
